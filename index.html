<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>С Днем Рождения!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Marck+Script&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            /* Высота с учётом мобильных браузеров */
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 16px;
            overflow: hidden;
            position: relative;
            color: white;
            background-color: #1a0b12;
        }

        /* --- ФОН --- */
        #bg-gradient {
            position: absolute; top: -10%; left: -10%; width: 120%; height: 120%;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            background-size: 200% 200%;
            animation: gradientShift 8s ease infinite;
            z-index: 0;
            transition: transform 0.15s cubic-bezier(0.2, 0.8, 0.2, 1);
            will-change: transform;
        }
        #bg-gradient.beat { transform: scale(1.04); }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .heart-bg {
            position: absolute; top: -10vh; color: rgba(255, 255, 255, 0.4);
            animation: fall linear infinite; z-index: 1; pointer-events: none;
        }
        @keyframes fall {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(120vh) rotate(360deg); opacity: 0; }
        }

        /* --- ЭКРАНЫ --- */
        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            z-index: 10;
            padding: 20px;
            text-align: center;
            box-sizing: border-box;
            overflow-y: auto;
            transition: opacity 0.5s ease;
        }
        .screen.active { display: flex; }

        /* ЭКРАН 1: Котик */
        #start-screen { cursor: pointer; animation: floatCat 3s ease-in-out infinite; }
        .cat-container {
            background: rgba(255, 255, 255, 0.2); border-radius: 50%; width: 180px; height: 180px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 10px 30px rgba(214, 51, 132, 0.2); backdrop-filter: blur(10px);
            border: 2px solid rgba(255,255,255,0.5); margin-bottom: 30px;
        }
        .cat-svg { width: 120px; height: 120px; fill: white; filter: drop-shadow(0 5px 10px rgba(0,0,0,0.1)); }
        .hint {
            color: #d63384; background: rgba(255, 255, 255, 0.8); padding: 15px 35px;
            border-radius: 50px; font-size: 18px; font-weight: 700; letter-spacing: 1px;
            box-shadow: 0 10px 25px rgba(214, 51, 132, 0.2); animation: pulseHint 2s infinite;
        }
        @keyframes floatCat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
        @keyframes pulseHint { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }

        /* ЭКРАН 2: Карточки */
        .cards-container {
            display: flex; flex-wrap: wrap; justify-content: center; gap: 15px;
            max-width: 350px; perspective: 1000px;
        }
        .card {
            width: 140px; height: 140px; position: relative; transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1); cursor: pointer;
        }
        .card.flipped { transform: rotateY(180deg); }
        .card-face {
            position: absolute; width: 100%; height: 100%; backface-visibility: hidden;
            border-radius: 15px; display: flex; align-items: center; justify-content: center;
            padding: 10px; text-align: center; box-shadow: 0 10px 20px rgba(214, 51, 132, 0.2);
        }
        .card-front {
            background: linear-gradient(135deg, #ff6b81, #ff4757); font-size: 40px;
            border: 3px solid white; transition: transform 0.1s;
        }
        .card:active .card-front { transform: scale(0.95); }
        .card-back {
            background: rgba(255, 255, 255, 0.95); transform: rotateY(180deg);
            font-size: 13px; font-weight: 600; color: #d63384; line-height: 1.3;
        }

        /* --- ЭКРАН 3: Финал --- */
        #final-screen {
            opacity: 0;
            transition: opacity 1.5s ease-in;
            position: relative;
            width: 100%;
            height: 100%;
        }
        #final-screen.active { opacity: 1; display: flex; }

        .final-content-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            z-index: 10;
            padding: 30px 16px;
            box-sizing: border-box;
        }

        .layout-container {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 900px;
            gap: 30px;
            padding: 20px;
        }

        .side-text-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 150px;
        }

        .side-text {
            font-family: 'Marck Script', cursive;
            font-size: 32px;
            color: #fff;
            text-shadow: 2px 2px 0px #d63384, 0 0 15px rgba(255,255,255,0.6);
            text-align: center;
            line-height: 1.2;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        .side-text.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* Слайдер */
        .slider {
            position: relative;
            width: 300px;
            max-width: 80vw;
            max-height: 55vh;
            aspect-ratio: 3 / 4;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(214, 51, 132, 0.4);
            border: 5px solid white;
            background-color: #333;
            transform: scale(0.9);
            transition: transform 1.5s ease;
        }
        #final-screen.active .slider { transform: scale(1); }

        .slider img {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; opacity: 0; transition: opacity 1.5s ease-in-out;
        }
        .slider img.active { opacity: 1; }

        /* Основной текст под фото */
        .text-container {
            margin-top: 20px; z-index: 10;
            opacity: 0; transform: translateY(20px);
            transition: opacity 1s ease 1s, transform 1s ease 1s;
        }
        #final-screen.active .text-container { opacity: 1; transform: translateY(0); }

        .text-container h1 {
            font-family: 'Marck Script', cursive; font-size: 46px; color: #fff;
            margin-bottom: 5px; text-shadow: 2px 2px 0px #d63384, 0 0 20px rgba(255,255,255,0.5);
        }
        .text-container p {
            font-size: 15px; color: #fff; font-weight: 600;
            text-shadow: 1px 1px 3px rgba(214, 51, 132, 0.8);
        }

        /* Мобильная адаптация */
        @media (max-width: 768px) {
            .layout-container {
                flex-direction: column;
                gap: 10px;
                padding: 10px;
            }
            .side-text-wrapper {
                min-height: 50px;
            }
            .side-text {
                font-size: 22px;
            }
            .slider {
                max-height: 50vh;
            }
            .text-container {
                margin-top: 12px;
            }
            .text-container h1 { font-size: 32px; }
            .text-container p { font-size: 13px; }
        }

        /* Очень низкие экраны (ландшафт / маленькие телефоны) */
        @media (max-height: 600px) {
            .slider { max-height: 45vh; }
            .side-text { font-size: 18px; }
            .text-container h1 { font-size: 28px; }
        }
    </style>
</head>
<body>

    <div id="bg-gradient"></div>
    <div id="bg-hearts"></div>

    <!-- ЭКРАН 1 -->
    <div id="start-screen" class="screen active" onclick="startExperience()">
        <div class="cat-container">
            <svg class="cat-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <path d="M 20 40 L 10 15 L 35 25 C 42 20 58 20 65 25 L 90 15 L 80 40 C 90 55 90 80 50 90 C 10 80 10 55 20 40 Z" />
                <circle cx="35" cy="55" r="4" fill="#ff6b81"/>
                <circle cx="65" cy="55" r="4" fill="#ff6b81"/>
                <path d="M 45 65 Q 50 70 55 65" stroke="#ff6b81" stroke-width="3" fill="none" stroke-linecap="round"/>
            </svg>
        </div>
        <div class="hint">Нажми на котика 🐾</div>
    </div>

    <!-- ЭКРАН 2 -->
    <div id="memories-screen" class="screen">
        <h2 style="font-family: 'Marck Script', cursive; font-size: 36px; color: #fff; margin-bottom: 30px; text-shadow: 2px 2px 0px #d63384;">Открой наши моменты</h2>
        <div class="cards-container">
            <div class="card" onclick="flipCard(this)">
                <div class="card-face card-front">✨</div>
                <div class="card-face card-back">Тот самый день, когда всё началось...</div>
            </div>
            <div class="card" onclick="flipCard(this)">
                <div class="card-face card-front">☕</div>
                <div class="card-face card-back">Наши долгие разговоры по ночам</div>
            </div>
            <div class="card" onclick="flipCard(this)">
                <div class="card-face card-front">🎬</div>
                <div class="card-face card-back">Фильмы, которые мы смотрели вместе</div>
            </div>
            <div class="card" onclick="flipCard(this)">
                <div class="card-face card-front">❤️</div>
                <div class="card-face card-back">И ещё миллион причин, почему я тебя люблю</div>
            </div>
        </div>
    </div>

    <!-- ЭКРАН 3: Финал -->
    <div id="final-screen" class="screen">
        <div class="final-content-wrapper">
            <div class="layout-container">

                <div class="side-text-wrapper">
                    <div class="side-text left" id="text-left"></div>
                </div>

                <!-- Слайдер на 12 фотографий -->
                <div class="slider">
                    <img src="image/1.jpg" class="active" alt="Фото 1">
                    <img src="image/2.jpg" alt="Фото 2">
                    <img src="image/3.jpg" alt="Фото 3">
                    <img src="image/4.jpg" alt="Фото 4">
                    <img src="image/5.jpg" alt="Фото 5">
                    <img src="image/6.jpg" alt="Фото 6">
                    <img src="image/7.jpg" alt="Фото 7">
                    <img src="image/8.jpg" alt="Фото 8">
                    <img src="image/9.jpg" alt="Фото 9">
                    <img src="image/10.jpg" alt="Фото 10">
                    <img src="image/11.jpg" alt="Фото 11">
                    <img src="image/12.jpg" alt="Фото 12">
                </div>

                <div class="side-text-wrapper">
                    <div class="side-text right" id="text-right"></div>
                </div>

            </div>

            <div class="text-container">
                <h1>С Днем Рождения!</h1>
                <p>Ты — мой самый любимый человек. Спасибо, что ты рядом. ❤️</p>
            </div>
        </div>
    </div>

    <audio id="bg-music" loop>
        <source src="music/music.mp3" type="audio/mpeg">
    </audio>

    <script>
        // --- 1. Фоновые сердечки ---
        const bgHearts = document.getElementById('bg-hearts');
        const heartIcons = ['❤️', '💖', '💘', '💕', '💗'];

        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart-bg');
            heart.innerText = heartIcons[Math.floor(Math.random() * heartIcons.length)];
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 3 + 5) + 's';
            heart.style.fontSize = (Math.random() * 15 + 10) + 'px';
            bgHearts.appendChild(heart);
            setTimeout(() => { heart.remove(); }, 8000);
        }
        setInterval(createHeart, 400);

        // --- 2. Экраны ---
        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function startExperience() {
            showScreen('memories-screen');
        }

        // --- 3. Карточки ---
        let flippedCount = 0;
        const totalCards = 4;

        function flipCard(card) {
            if (card.classList.contains('flipped')) return;
            card.classList.add('flipped');
            flippedCount++;

            if (flippedCount === totalCards) {
                setTimeout(() => { triggerFinale(); }, 800);
            }
        }

        // --- 4. Логика сменяющихся боковых надписей ---
        const phrases = [
            { left: "Ты — моё<br>вдохновение", right: "Мой самый<br>родной человек" },
            { left: "С тобой<br>я счастлив", right: "Ты делаешь<br>мир лучше" },
            { left: "Каждый день<br>с тобой — праздник", right: "Моя<br>любимая" },
            { left: "Ты — моя<br>вселенная", right: "Спасибо<br>за всё" }
        ];

        let currentPhraseIndex = 0;
        const textLeft = document.getElementById('text-left');
        const textRight = document.getElementById('text-right');
        let phraseInterval;

        function changePhrases() {
            textLeft.classList.remove('show');
            textRight.classList.remove('show');

            setTimeout(() => {
                currentPhraseIndex++;

                // Если фразы закончились, останавливаемся на последней (Люблю тебя)
                if (currentPhraseIndex < phrases.length) {
                    textLeft.innerHTML = phrases[currentPhraseIndex].left;
                    textRight.innerHTML = phrases[currentPhraseIndex].right;
                    textLeft.classList.add('show');
                    textRight.classList.add('show');
                } else {
                    // Останавливаем таймер и оставляем финальный текст навсегда
                    clearInterval(phraseInterval);
                    textLeft.innerHTML = "Люблю тебя ♥";
                    textRight.innerHTML = "Люблю тебя ♥";
                    textLeft.classList.add('show');
                    textRight.classList.add('show');
                }
            }, 800);
        }

        // --- 5. Финал ---
        function triggerFinale() {
            showScreen('final-screen');

            const music = document.getElementById('bg-music');
            music.play().catch(e => console.log("Музыка не загружена"));

            const bgGradient = document.getElementById('bg-gradient');
            setInterval(() => {
                if (!music.paused) {
                    bgGradient.classList.add('beat');
                    setTimeout(() => { bgGradient.classList.remove('beat'); }, 150);
                }
            }, 500);

            // Инициализация первой пары
            textLeft.innerHTML = phrases[0].left;
            textRight.innerHTML = phrases[0].right;

            setTimeout(() => {
                textLeft.classList.add('show');
                textRight.classList.add('show');
            }, 500);

            // Запускаем смену фраз каждые 4 секунды
            phraseInterval = setInterval(changePhrases, 4000);

            // Запускаем слайд-шоу
            startSlider();
        }

        // --- 6. Слайд-шоу (12 фото) ---
        function startSlider() {
            const images = document.querySelectorAll('.slider img');
            let currentIndex = 0;
            setInterval(() => {
                images[currentIndex].classList.remove('active');
                currentIndex = (currentIndex + 1) % images.length;
                images[currentIndex].classList.add('active');
            }, 3000); // Меняются каждые 3 секунды
        }
    </script>
</body>
</html>
